name: CI

on:
  push:
    branches: [shrek]
  pull_request:

permissions:
  contents: read

# "shell: bash" turns on pipefail, so a failing command in a pipeline fails
# its step.
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request makes the older run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs because a tag can be moved; the comment
# names the release each SHA belongs to.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      # Staticcheck keeps its results outside the Go build cache, so without
      # this it re-analyzes every dependency on each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticcheck
          key: staticcheck-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: staticcheck-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh worker/scripts/*.sh

  # Linux tests run split across machines in the dogfood job below.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      - name: go build
        run: go build ./...
      # The race detector needs cgo, which the Windows runner lacks by default.
      - name: go test
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

  # Builds the release binaries the way a tag would, for the jobs below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      - name: build
        run: scripts/build-release.sh dev dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  # Installs the build through action.yml on every runner OS.
  action:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./
        env:
          BUNPO_RELEASE_DIR: dist
      - name: run the installed bunpo
        run: |
          bunpo version
          ! command -v bunpo-server >/dev/null 2>&1
          printf 'tests/a.py\ntests/b.py\n' | bunpo split --dir "$RUNNER_TEMP/smoke" --index 0 --total 2
      - name: smoke test bunpo-server and dashboard
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          case "$RUNNER_OS_NAME" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            Windows) os=windows ;;
          esac
          case "$RUNNER_ARCH_NAME" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
          esac
          ext=""
          [ "$os" = windows ] && ext=.exe
          srv="dist/bunpo-server-$os-$arch$ext"
          chmod +x "$srv"
          BUNPO_QUEUE_TOKEN="ci-smoke-write-token-0123456789ab" \
          BUNPO_QUEUE_READ_TOKEN="ci-smoke-read-token-fedcba987654" \
            "$srv" --addr 127.0.0.1:18080 >/dev/null 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz 2>/dev/null | grep -q '{"ok":true}'; then
              ok=1
              break
            fi
            sleep 0.2
          done
          test "$ok" -eq 1
          curl -fsSI http://127.0.0.1:18080/ | grep -qi "content-security-policy:"
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Bunpō Queue'

  # Bunpō splits its own test packages across two machines. Timings come from
  # the cache that shrek saves.
  dogfood:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        machine: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./
        env:
          BUNPO_RELEASE_DIR: dist
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bunpo/timings.json
          key: bunpo-timings-${{ github.sha }}
          restore-keys: bunpo-timings-
      - name: test this machine's packages
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: scripts/dogfood.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunpo-${{ strategy.job-index }}
          path: |
            .bunpo/manifest-*.json
            .bunpo/report-*.json
          include-hidden-files: true

  dogfood-check:
    needs: dogfood
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./
        env:
          BUNPO_RELEASE_DIR: dist
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bunpo/timings.json
          key: bunpo-timings-${{ github.sha }}
          restore-keys: bunpo-timings-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bunpo-*
          path: .bunpo
          merge-multiple: true
      - name: verify
        run: scripts/dogfood.sh packages | bunpo verify
      - name: merge
        run: bunpo merge
      # Only passing pushes to shrek save timings, so pull requests never
      # change them and re-running a failed shard restores the same timings.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/shrek' && needs.dogfood.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bunpo/timings.json
          key: bunpo-timings-${{ github.run_id }}-${{ github.run_attempt }}

  # Tests the Cloudflare Worker locally against workerd/Miniflare (zero secrets,
  # zero Cloudflare API calls, installs with scripts disabled).
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: ${{ github.workspace }}/worker/.wrangler/logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: npm ci (scripts disabled)
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: typecheck
        working-directory: worker
        run: npm run typecheck
      - name: core vector tests
        working-directory: worker
        run: npm run test:core
      - name: differential replay (well-behaved + hostile)
        run: |
          mkdir -p "$RUNNER_TEMP/diff-traces"
          BUNPO_SIM_EXPORT_DIR="$RUNNER_TEMP/diff-traces" BUNPO_SIM_COUNT=500 go test -count=1 -run '^TestSim$' ./internal/sim
          BUNPO_SIM_HOSTILE_DIR="$RUNNER_TEMP/diff-traces" go test -count=1 -run '^TestExportHostileCommands$' ./internal/sim
          (cd worker && BUNPO_SIM_EXPORT_DIR="$RUNNER_TEMP/diff-traces" npm run test:core)
      - name: Durable Object lifecycle and eviction DST
        working-directory: worker
        run: npm run test:do
      - name: black-box protocol and bunpo --queue E2E against local workerd
        run: ./worker/scripts/test-blackbox.sh
