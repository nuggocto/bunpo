name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# "shell: bash" turns on pipefail, so a failing command in a pipeline fails
# its step.
defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs because a tag can be moved; the comment
# names the release each SHA belongs to.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      # The full history lets Go stamp the version from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go test
        run: go test -race ./...
      # Release builds use exactly the toolchain go.mod names.
      - name: build
        run: |
          GOTOOLCHAIN=$(go mod edit -json | jq -r .Toolchain)
          export GOTOOLCHAIN
          scripts/build-release.sh "$GITHUB_REF_NAME" dist
      # Publish as a prerelease first so @v0 and releases/latest never serve an
      # unchecked binary. The major job promotes stable tags after check passes.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --prerelease

  # Installs the published release through action.yml on every runner OS,
  # the way users will, before promoting it to stable and moving the major tag.
  check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: ${{ github.ref_name }}
      - name: run the installed bunpo
        run: |
          test "$(bunpo version)" = "bunpo $GITHUB_REF_NAME"
          ! command -v bunpo-server >/dev/null 2>&1
          printf 'tests/a.py\ntests/b.py\n' | bunpo split --dir "$RUNNER_TEMP/smoke" --index 0 --total 2
      - name: smoke test bunpo-server release binary
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          case "$RUNNER_OS_NAME" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            Windows) os=windows ;;
          esac
          case "$RUNNER_ARCH_NAME" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
          esac
          ext=""
          [ "$os" = windows ] && ext=.exe
          asset="bunpo-server-$os-$arch$ext"
          dir="$RUNNER_TEMP/server-smoke"
          mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern SHA256SUMS --dir "$dir"
          want=$(awk -v f="$asset" '$2 == f { print $1 }' "$dir/SHA256SUMS")
          if command -v sha256sum >/dev/null; then
            got=$(sha256sum <"$dir/$asset" | cut -d' ' -f1)
          else
            got=$(shasum -a 256 <"$dir/$asset" | cut -d' ' -f1)
          fi
          test -n "$want" && test "$want" = "$got"
          chmod +x "$dir/$asset"
          BUNPO_QUEUE_TOKEN="release-check-write-token-012345" \
          BUNPO_QUEUE_READ_TOKEN="release-check-read-token-fedcba98" \
            "$dir/$asset" --addr 127.0.0.1:18080 >/dev/null 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz 2>/dev/null | grep -q '{"ok":true}'; then
              ok=1
              break
            fi
            sleep 0.2
          done
          test "$ok" -eq 1
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Bunpō Queue'

  # Promotes a checked stable tag out of prerelease and moves the major tag
  # (`uses: nuggocto/bunpo@v0`). A prerelease such as v0.0.3-rc.1 stays a
  # prerelease and leaves v0 where it is.
  major:
    needs: check
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # promote the release and move the major tag
    steps:
      - name: promote release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          major=${GITHUB_REF_NAME%%.*}
          # git/ref (singular) matches exactly; git/refs/tags/v0 would also
          # list v0.0.1 and report a v0 tag that does not exist.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
          fi
